# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: MongoDB
    group: Configuration Managment
    application: mongodb
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 800
    state:
      enabled: true
      size: 1
    network:
      serviceName: mongodb
      ports:
        - port: 27017
          targetPort: 27017
  - name: Dynamic Configuration Manager
    group: Configuration Managment
    application: DynamicConfiguration
    version: latest
    deploymentType: Managed
    resources:
      limits:
        cpu: 500
        memory: 1000
    publicAccess:
      enabled: true
      urlPrefix: config-api-svc
    configuration:
      topic: config-ui
      mongoHost: mongodb
      mongoPort: 27017
      mongoUser: admin
      mongoPasswordSecret: MONGO_ROOT_PASSWORD
      mongoDatabase: configurations
      mongoCollection: configurations
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
  - name: OpenF1 Metadata Sink
    group: F1
    application: openf1-metadata-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 300
    desiredStatus: Running
  - name: OpenF1 Importer
    group: F1
    application: openf1-importer
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 500
        memory: 1000
    variables:
      - name: OPENF1_YEAR
        value: 2024
  - name: OpenF1 Car Data Enricher
    group: F1
    application: openf1-car-data-enricher
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    desiredStatus: Running
    variables:
      - name: LOOKUP_FIELDS_JSON
        value: '{"driver_full_name":"drivers.full_name","driver_acronym":"drivers.name_acronym","year":"sessions.year","circuit":"sessions.circuit_short_name","session_type":"sessions.session_type","session_name":"sessions.session_name","meeting_name":"meetings.meeting_name"}'
      - name: CONSUMER_GROUP_NAME
        value: openf1-car-data-enricher-v2
  - name: OpenF1 Lap Enricher
    group: F1
    application: openf1-lap-enricher
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 300
        memory: 500
    desiredStatus: Running
    variables:
      - name: CONSUMER_GROUP
        value: openf1-lap-enricher-v3.1
  - name: OpenF1 Lap Enriched Lake Sink
    group: F1
    application: quixlake-timeseries-destination
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    desiredStatus: Running
    variables:
      - name: input
        value: openf1-car-data-lap-enriched
      - name: TABLE_NAME
        value: car_telemetry
      - name: HIVE_COLUMNS
        value: year,circuit,session_type,session_name,driver_acronym,lap_number
      - name: TIMESTAMP_COLUMN
        value: ts_ms
      - name: CONSUMER_GROUP
        value: openf1-lap-enriched-lake-sink-v1.1
    blobStorage:
      bind: true
  - name: Formula E Importer
    group: FormulaE
    application: formulae-importer
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 500
        memory: 500
  - name: Formula E Lake Sink
    group: FormulaE
    application: quixlake-timeseries-destination
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    desiredStatus: Running
    variables:
      - name: input
        value: formulae-raw
      - name: TABLE_NAME
        value: formulae_lap_data
      - name: HIVE_COLUMNS
        value: season,event_name,session_type,driver_name
      - name: TIMESTAMP_COLUMN
        value: ts_ms
      - name: CONSUMER_GROUP
        value: formulae-lake-sink-v1
    blobStorage:
      bind: true
  - name: QuixLab
    application: quixlab
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 500
        memory: 2000
    publicAccess:
      enabled: true
      urlPrefix: quixlab
    state:
      enabled: true
      size: 1
    network:
      ports:
        - port: 80
          targetPort: 80
    plugin:
      embeddedView:
        enabled: true
        hideHeader: true
        default: true
      sidebarItem:
        show: true
        label: QuixLab
        icon: grid_view
        order: 1
      globalItem:
        show: true
        label: QuixLab
        icon: find_in_page
        order: 1
    blobStorage:
      bind: true
  - name: InfluxDB v3 alpha
    application: influxdb-v3-alpha
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 1000
        memory: 8000
    network:
      serviceName: influxdb3
      ports:
        - port: 80
          targetPort: 8181
  - name: InfluxDB 3.0 Sink
    application: influxdb-3.0-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    variables:
      - name: input
        value: openf1-car-data-enriched

# This section describes the Topics of the data pipeline
topics:
  - name: config-ui
  - name: openf1-meetings
    configuration:
      partitions: 1
      retentionInMinutes: -1
  - name: openf1-sessions
    configuration:
      partitions: 1
      retentionInMinutes: -1
  - name: openf1-drivers
    configuration:
      partitions: 1
      retentionInMinutes: -1
  - name: openf1-laps
    configuration:
      partitions: 4
      retentionInMinutes: -1
  - name: openf1-stints
    configuration:
      partitions: 1
      retentionInMinutes: -1
  - name: openf1-pit
    configuration:
      partitions: 1
      retentionInMinutes: -1
  - name: openf1-position
    configuration:
      partitions: 1
      retentionInMinutes: -1
  - name: openf1-intervals
    configuration:
      partitions: 1
      retentionInMinutes: -1
  - name: openf1-weather
    configuration:
      partitions: 1
      retentionInMinutes: -1
  - name: openf1-race-control
    configuration:
      partitions: 1
      retentionInMinutes: -1
  - name: openf1-team-radio
    configuration:
      partitions: 1
      retentionInMinutes: -1
  - name: openf1-car-data
    configuration:
      partitions: 4
      retentionInMinutes: -1
  - name: openf1-car-data-enriched
    configuration:
      partitions: 4
      retentionInMinutes: -1
  - name: openf1-car-data-lap-enriched
    configuration:
      partitions: 4
      retentionInMinutes: -1
      retentionInBytes: 52428800
  - name: test-data
  - name: test-laps
  - name: test-output
  - name: formulae-raw
    configuration:
      partitions: 1
      retentionInMinutes: -1
  - name: stats
    configuration:
      partitions: 4
      replicationFactor: 2
      retentionInMinutes: 1440
  - name: input-data
