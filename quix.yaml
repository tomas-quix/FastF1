# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

deployments:
  - name: OpenF1 Source
    application: openf1-source
    deploymentType: Job
    version: latest
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: YEAR
        value: "2024"
      - name: TRACK
        value: "Monza"
      - name: SESSION_NAME
        value: "Race"

topics:
  - name: raw-openf1-car-data
    configuration:
      partitions: 4

