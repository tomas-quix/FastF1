# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: OpenF1 Source
    application: openf1-source
    version: latest
    deploymentType: Job
    resources:
      limits:
        cpu: 200
        memory: 500
    variables:
      - name: YEAR
        value: 2024
      - name: TRACK
        value: Monza
      - name: SESSION_NAME
        value: Race
  - name: Quix Lakehouse Sink
    application: quix-lakehouse-sink
    version: latest
    deploymentType: Service
    resources:
      limits:
        cpu: 200
        memory: 500
    blobStorage:
      bind: true

# This section describes the Topics of the data pipeline
topics:
  - name: raw-openf1-car-data
    configuration:
      partitions: 4
